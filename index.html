<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Tabungan</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    .card-base {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      transition: all 0.3s ease;
    }

    /* Mengurangi max-height dari 600px ke 380px agar pas menampilkan sekitar 2 minggu saja, sisanya scroll */
    .summary-area {
      max-height: 380px;
      overflow-y: auto;
    }

    .summary-area::-webkit-scrollbar {
      width: 6px;
    }

    .summary-area::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
  </style>
</head>

<body class="p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Header Card -->
    <div class="card-base p-8 md:p-14 shadow-xl bg-gradient-to-r from-white to-emerald-50 relative overflow-hidden">
      <div class="relative z-10">
        <h1 class="text-[28px] sm:text-[42px] md:text-6xl font-extrabold text-slate-900 leading-tight whitespace-nowrap">
          Dashboard <span class="text-emerald-600">Tabungan</span>
        </h1>

        <p class="text-base md:text-xl text-slate-500 mt-4 italic font-medium">
          Assalamualaikum Malang
        </p>

        <div class="flex items-center gap-3 mt-3">
          <p id="lastUpdate" class="text-xs text-slate-400">
            Menunggu update...
          </p>
          <!-- Tombol Refresh Manual -->
          <button onclick="muatData(false)" id="btnRefresh" class="text-xs text-emerald-600 hover:text-emerald-700 font-semibold focus:outline-none hidden">
            ⟳ Refresh
          </button>
        </div>
      </div>
      <!-- Dekorasi Estetik di Background -->
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-emerald-100 rounded-full blur-3xl opacity-50"></div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-emerald-600 rounded-[24px] p-6 text-white shadow-md hover:shadow-lg transition-shadow">
        <p id="labelTotal" class="text-xs uppercase tracking-widest opacity-80 font-bold">
          Total Tabungan
        </p>
        <h2 id="totalTabungan" class="text-4xl font-extrabold mt-3 text-white">
          Rp 0
        </h2>
      </div>

      <div class="card-base p-6 shadow-sm hover:shadow-md">
        <p id="labelTransaksi" class="text-xs uppercase tracking-widest text-slate-400 font-bold">
          Jumlah Transaksi
        </p>
        <h2 id="countSetoran" class="text-4xl font-extrabold mt-3">
          0
        </h2>
      </div>
    </div>

    <!-- Kolom Pencarian Nama -->
    <div class="card-base p-4 shadow-sm bg-white flex items-center gap-3">
      <div class="text-slate-400 pl-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </div>
      <input 
        type="text" 
        id="inputCariNama" 
        placeholder="Cari nama anggota keluarga..." 
        class="w-full bg-transparent text-sm font-medium placeholder-slate-400 text-slate-700 focus:outline-none"
        oninput="tanganiPencarian()"
      />
    </div>

    <!-- Summary Section -->
    <div class="card-base overflow-hidden shadow-sm">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
        <h2 class="font-bold text-slate-700 text-xs uppercase tracking-widest">
          Ringkasan Mingguan
        </h2>
        <span id="statusBadge" class="text-[10px] bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full font-bold transition-all">
          Terupdate
        </span>
      </div>

      <!-- Area list dibatasi tingginya melalui kelas .summary-area -->
      <div id="ringkasanNama" class="summary-area p-5 space-y-4 bg-slate-50/50">
        <div class="text-center py-8 text-slate-400 italic text-sm animate-pulse">
          Menghubungkan ke server Google...
        </div>
      </div>
    </div>

  </div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxeDlfdcAgps5xGGIKR6t4ByANwmNL6gd7kZ0O0WFYQ-ssfTOI_UPhcVlwZp4uryBQZ6Q/exec";
    const SECRET_KEY = "keluarga123";

    let dataCache = null;

    function formatIDR(angka = 0) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(Number(angka));
    }

    function escapeHTML(str = '') {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    function tampilkanLoading() {
      document.getElementById('ringkasanNama').innerHTML = `
        <div class="text-center py-10 text-slate-400 animate-pulse italic">
          Memuat data tabungan...
        </div>
      `;
    }

    function tampilkanError(pesan = "Terjadi kesalahan") {
      document.getElementById('ringkasanNama').innerHTML = `
        <div class="text-center py-10">
          <p class="text-red-500 font-bold">Data tidak dapat dimuat</p>
          <p class="text-xs text-slate-400 mt-2">${escapeHTML(pesan)}</p>
        </div>
      `;
    }

    async function ambilData() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);

      try {
        const response = await fetch(`${URL_API}?key=${SECRET_KEY}`, {
          method: 'GET',
          signal: controller.signal
        });
        clearTimeout(timeout);

        if (!response.ok) throw new Error("Server gagal merespon");
        return await response.json();
      } catch (err) {
        if (err.name === 'AbortError') throw new Error("Koneksi timeout");
        throw err;
      }
    }

    function renderStatistik(data, kataKunci = "") {
      let total = 0;
      let jumlahTransaksi = 0;
      const query = kataKunci.toLowerCase().trim();

      if (data && Array.isArray(data.riwayat)) {
        if (query === "") {
          data.riwayat.forEach(item => {
            total += Number(item.jumlah || 0);
          });
          jumlahTransaksi = data.riwayat.length;
          document.getElementById('labelTotal').innerText = "Total Tabungan";
          document.getElementById('labelTransaksi').innerText = "Jumlah Transaksi";
        } else {
          data.riwayat.forEach(item => {
            if (String(item.nama || '').toLowerCase().includes(query)) {
              total += Number(item.jumlah || 0);
              jumlahTransaksi++;
            }
          });
          document.getElementById('labelTotal').innerText = `Total Tabungan Terfilter`;
          document.getElementById('labelTransaksi').innerText = `Minggu Berpartisipasi`;
        }
      }

      document.getElementById('totalTabungan').innerText = formatIDR(total);
      document.getElementById('countSetoran').innerText = jumlahTransaksi;
    }

    function renderRingkasan(data, kataKunci = "") {
      let html = "";
      const query = kataKunci.toLowerCase().trim();

      if (data && Array.isArray(data.ringkasan) && data.ringkasan.length > 0) {
        let adaDataCocok = false;

        data.ringkasan.forEach(group => {
          const detail = Array.isArray(group.detail) ? group.detail : [];
          const detailTersaring = detail.filter(item => 
            String(item.nama || '').toLowerCase().includes(query)
          );

          if (detailTersaring.length > 0) {
            adaDataCocok = true;
            html += `
              <div class="card-base p-5 shadow-sm border border-slate-100 bg-white hover:border-emerald-100">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">
                    ${escapeHTML(group.minggu || '-')}
                  </h3>
                  <span class="text-[10px] text-slate-400 font-bold">
                    ${detailTersaring.length} ANGGOTA
                  </span>
                </div>
                <div class="space-y-3">
                  ${detailTersaring.map(item => `
                    <div class="flex justify-between items-center bg-slate-50 border border-slate-100 rounded-xl p-3 hover:bg-emerald-50/30 transition-colors">
                      <p class="text-sm font-bold uppercase text-slate-700">
                        ${escapeHTML(item.nama || '-')}
                      </p>
                      <p class="text-emerald-700 font-black">
                        ${formatIDR(item.total || 0)}
                      </p>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }
        });

        if (!adaDataCocok && query !== "") {
          html = `
            <p class="text-center py-10 text-slate-400 italic">
              Nama "${escapeHTML(kataKunci)}" tidak ditemukan dalam riwayat mingguan.
            </p>
          `;
        }

      } else {
        html = `
          <p class="text-center py-10 text-slate-400 italic">
            Belum ada data mingguan.
          </p>
        `;
      }

      document.getElementById('ringkasanNama').innerHTML = html;
    }

    function updateWaktu() {
      const sekarang = new Date();
      const waktu = sekarang.toLocaleString('id-ID', {
        dateStyle: 'medium',
        timeStyle: 'short'
      });
      document.getElementById('lastUpdate').innerText = `Update terakhir: ${waktu}`;
    }

    function tanganiPencarian() {
      const kataKunci = document.getElementById('inputCariNama').value;
      if (dataCache) {
        renderStatistik(dataCache, kataKunci);
        renderRingkasan(dataCache, kataKunci);
      }
    }

    async function muatData(denganLoading = true) {
      const badge = document.getElementById('statusBadge');
      
      if (denganLoading) {
        tampilkanLoading();
      } else {
        if (badge) {
          badge.innerText = "Memperbarui...";
          badge.className = "text-[10px] bg-amber-100 text-amber-600 px-3 py-1 rounded-full font-bold";
        }
      }

      try {
        const data = await ambilData();
        dataCache = data;

        const kataKunciAktif = document.getElementById('inputCariNama').value;
        
        renderStatistik(data, kataKunciAktif);
        renderRingkasan(data, kataKunciAktif);
        
        updateWaktu();
        
        if (badge) {
          badge.innerText = "Terupdate";
          badge.className = "text-[10px] bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full font-bold";
        }
        document.getElementById('btnRefresh').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        if (!denganLoading && badge) {
          badge.innerText = "Gagal Memperbarui";
          badge.className = "text-[10px] bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold";
        } else {
          tampilkanError(err.message);
        }
      }
    }

    // Hanya dijalankan satu kali saat halaman pertama dibuka
    window.onload = () => {
      muatData(true);
    };
  </script>

</body>
</html>
